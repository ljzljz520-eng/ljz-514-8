<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高校无障碍路线规划</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">♿</span>
      <div>
        <h1>高校无障碍路线规划</h1>
        <p class="subtitle">优先避开楼梯与陡坡，为您规划电梯 · 坡道 · 平缓通道路线</p>
      </div>
    </div>
    <nav>
      <a href="/" class="active">学生端</a>
      <a href="/admin.html">管理员入口</a>
    </nav>
  </header>

  <main class="layout">
    <aside class="panel">
      <section class="card">
        <h2>选择起终点</h2>
        <label class="field">
          <span>出发地</span>
          <select id="startSel"></select>
        </label>
        <label class="field">
          <span>目的地</span>
          <select id="goalSel"></select>
        </label>

        <div class="mode-switch">
          <label class="mode-opt active" data-mode="accessible">
            <input type="radio" name="mode" value="accessible" checked>
            <span>♿ 无障碍优先</span>
          </label>
          <label class="mode-opt" data-mode="regular">
            <input type="radio" name="mode" value="regular">
            <span>🚶 普通步行</span>
          </label>
        </div>
        <p class="hint">也可以直接在地图上点击地点依次选择起点和终点</p>
        <button id="planBtn" class="primary">规划路线</button>
        <button id="clearBtn" class="ghost">清除</button>
      </section>

      <section class="card result-card" id="resultCard" hidden>
        <h2>规划结果</h2>
        <div id="summary"></div>
        <div id="compare"></div>
        <div id="warnings"></div>
        <h3>分步指引</h3>
        <ol id="steps" class="steps"></ol>
      </section>
    </aside>

    <section class="map-wrap card">
      <div class="legend">
        <span><i class="lg lg-path"></i>平缓通道</span>
        <span><i class="lg lg-ramp"></i>无障碍坡道</span>
        <span><i class="lg lg-slope"></i>坡路</span>
        <span><i class="lg lg-stairs"></i>台阶</span>
        <span><i class="lg lg-elev"></i>电梯/楼层连接</span>
        <span><i class="lg lg-route"></i>无障碍路线</span>
        <span><i class="lg lg-cmp"></i>普通路线对比</span>
      </div>
      <svg id="map" viewBox="0 0 900 480" role="img" aria-label="校园无障碍地图"></svg>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
